server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/promtail-positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: status
            values: [running]

    relabel_configs:
      # Use the Docker Compose service name as the "service" label
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      # Keep only our application containers (backend + frontend)
      - source_labels: [service]
        regex: backend|frontend
        action: keep
      # Also expose the full container name for debugging
      - source_labels: [__meta_docker_container_name]
        target_label: container

    pipeline_stages:
      # The Docker json-file driver wraps each line:
      # {"log": "<app line>\n", "stream": "stdout", "time": "..."}
      # Extract the inner "log" string.
      - json:
          expressions:
            output: log
            stream: stream
      - labels:
          stream:
      - output:
          source: output

      # Now try to parse the app's own JSON log line.
      - json:
          expressions:
            msg: msg
            session_id: session_id
            call: call
      - labels:
          msg:
          session_id:

      # Drop noisy uvicorn access lines that are not our structured logs
      - drop:
          expression: "^INFO:"
          drop_counter_reason: uvicorn_access_log
