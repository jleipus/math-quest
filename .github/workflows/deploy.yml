name: Deploy backend to Cloud Run

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (e.g. 1.0.0). Defaults to latest in CHANGELOG.txt."
        required: false

env:
  REGION: europe-north1
  GAR_REPO: mathquest

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install backend dependencies
        run: poetry install --with dev

      - name: Run backend tests
        run: poetry run pytest backend/tests/ -v

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    if: inputs.version == ''
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push backend image
        id: version
        run: |
          VERSION=v$(head -1 CHANGELOG.txt)
          PROJECT_ID=$(gcloud config get-value project)
          REGISTRY=${{ env.REGION }}-docker.pkg.dev/$PROJECT_ID/${{ env.GAR_REPO }}
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

          docker build -t $REGISTRY/mathquest-backend:$VERSION -t $REGISTRY/mathquest-backend:latest -f ./backend/Dockerfile .
          docker push $REGISTRY/mathquest-backend:$VERSION
          docker push $REGISTRY/mathquest-backend:latest

          echo "tag=$VERSION" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped') && needs.test.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Write backend env file
        env:
          DAIS_LLM_PROVIDER: ${{ secrets.DAIS_LLM_PROVIDER }}
          DAIS_CLAUDE_API_KEY: ${{ secrets.DAIS_CLAUDE_API_KEY }}
          DAIS_GEMINI_API_KEY: ${{ secrets.DAIS_GEMINI_API_KEY }}
          DAIS_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          DAIS_ALLOWED_ORIGINS: ${{ secrets.DAIS_ALLOWED_ORIGINS }}
        run: |
          python - <<'PY'
          import json, os
          keys = [
              "DAIS_LLM_PROVIDER",
              "DAIS_CLAUDE_API_KEY",
              "DAIS_GEMINI_API_KEY",
              "DAIS_FIREBASE_SERVICE_ACCOUNT_JSON",
              "DAIS_ALLOWED_ORIGINS",
          ]
          json.dump({k: os.environ.get(k, "") for k in keys}, open("env.json", "w"))
          PY

      - name: Deploy backend
        env:
          VERSION: ${{ inputs.version != '' && format('v{0}', inputs.version) || needs.build.outputs.version }}
        run: |
          PROJECT_ID=$(gcloud config get-value project)
          REGISTRY=${{ env.REGION }}-docker.pkg.dev/$PROJECT_ID/${{ env.GAR_REPO }}
          gcloud run deploy mathquest-backend \
            --image "$REGISTRY/mathquest-backend:$VERSION" \
            --region "${{ env.REGION }}" \
            --port 8080 \
            --memory 1Gi \
            --min-instances 0 \
            --max-instances 1 \
            --allow-unauthenticated \
            --env-vars-file env.json
