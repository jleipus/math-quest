name: Deploy to Cloud Run

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g. 1.0.0). Defaults to latest in CHANGELOG.txt.'
        required: false

env:
  REGION: europe-north1
  GAR_REPO: mathquest

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip build when deploying a specific existing version
    if: inputs.version == ''
    outputs:
      version: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push images
        id: version
        run: |
          VERSION=v$(head -1 CHANGELOG.txt)
          PROJECT_ID=$(gcloud config get-value project)
          REGISTRY=${{ env.REGION }}-docker.pkg.dev/$PROJECT_ID/${{ env.GAR_REPO }}
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

          docker build -t $REGISTRY/mathquest-backend:$VERSION -t $REGISTRY/mathquest-backend:latest -f ./backend/Dockerfile .
          docker push $REGISTRY/mathquest-backend:$VERSION
          docker push $REGISTRY/mathquest-backend:latest

          BACKEND_URL=$(gcloud run services describe mathquest-backend \
            --region ${{ env.REGION }} --format 'value(status.url)' 2>/dev/null || echo "")
          docker build \
            --build-arg "NEXT_PUBLIC_API_URL=${BACKEND_URL}/api/v1" \
            -t $REGISTRY/mathquest-frontend:$VERSION \
            -t $REGISTRY/mathquest-frontend:latest \
            ./frontend
          docker push $REGISTRY/mathquest-frontend:$VERSION
          docker push $REGISTRY/mathquest-frontend:latest

          echo "tag=$VERSION" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform apply
        working-directory: terraform
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
          TF_VAR_claude_api_key: ${{ secrets.DAIS_CLAUDE_API_KEY }}
          TF_VAR_gemini_api_key: ${{ secrets.DAIS_GEMINI_API_KEY }}
          TF_VAR_llm_provider: ${{ secrets.DAIS_LLM_PROVIDER }}
          TF_VAR_image_tag: ${{ inputs.version != '' && format('v{0}', inputs.version) || needs.build.outputs.version }}
        run: |
          terraform init
          terraform apply -auto-approve
