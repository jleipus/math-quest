name: Deploy backend to Cloud Run

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag (12-char commit SHA) to redeploy. Leave empty to build and deploy the current commit."
        required: false

env:
  REGION: europe-north1
  GAR_REPO: mathquest

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install backend dependencies
        run: poetry install --with dev

      - name: Run backend tests
        run: poetry run pytest backend/tests/ -v

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/web

      - name: Run frontend tests
        run: npm test
        working-directory: apps/web

  build:
    runs-on: ubuntu-latest
    needs: test
    # Skip the build when redeploying an existing image by tag
    if: inputs.image_tag == ''
    outputs:
      image_tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push backend image
        id: build
        run: |
          TAG=${GITHUB_SHA::12}
          PROJECT_ID=$(gcloud config get-value project)
          REGISTRY=${{ env.REGION }}-docker.pkg.dev/$PROJECT_ID/${{ env.GAR_REPO }}
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

          docker build -t $REGISTRY/mathquest-backend:$TAG -t $REGISTRY/mathquest-backend:latest -f ./backend/Dockerfile .
          docker push $REGISTRY/mathquest-backend:$TAG
          docker push $REGISTRY/mathquest-backend:latest

          echo "tag=$TAG" >> $GITHUB_OUTPUT

  deploy:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped') && needs.test.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Write backend env file
        env:
          DAIS_LLM_PROVIDER: ${{ secrets.DAIS_LLM_PROVIDER }}
          DAIS_CLAUDE_API_KEY: ${{ secrets.DAIS_CLAUDE_API_KEY }}
          DAIS_GEMINI_API_KEY: ${{ secrets.DAIS_GEMINI_API_KEY }}
          DAIS_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          DAIS_ALLOWED_ORIGINS: ${{ secrets.DAIS_ALLOWED_ORIGINS }}
        run: |
          python - <<'PY'
          import json, os
          keys = [
              "DAIS_LLM_PROVIDER",
              "DAIS_CLAUDE_API_KEY",
              "DAIS_GEMINI_API_KEY",
              "DAIS_FIREBASE_SERVICE_ACCOUNT_JSON",
              "DAIS_ALLOWED_ORIGINS",
          ]
          json.dump({k: os.environ.get(k, "") for k in keys}, open("env.json", "w"))
          PY

      - name: Deploy backend
        env:
          IMAGE_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || needs.build.outputs.image_tag }}
        run: |
          PROJECT_ID=$(gcloud config get-value project)
          REGISTRY=${{ env.REGION }}-docker.pkg.dev/$PROJECT_ID/${{ env.GAR_REPO }}
          gcloud run deploy mathquest-backend \
            --image "$REGISTRY/mathquest-backend:$IMAGE_TAG" \
            --region "${{ env.REGION }}" \
            --port 8080 \
            --memory 1Gi \
            --min-instances 0 \
            --max-instances 1 \
            --allow-unauthenticated \
            --env-vars-file env.json
